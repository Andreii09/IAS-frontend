services:
  - type: web
    name: bantay-cordova-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      # Public origin of the backend service, e.g. https://bantay-cordova-api.onrender.com
      # No trailing slash.
      - key: API_ORIGIN
        sync: false
